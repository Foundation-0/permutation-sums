# A green run means verify.py agrees with results/certificate.json
# under python3 and under python -O, on the two Python versions below.
# It does not prove a theorem. It does not run a 2026 approximation algorithm.

name: Verify permutation sums

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check recorded SHA-256 hashes
        run: sha256sum -c SHA256SUMS
      - name: Replay the certificate
        run: python3 -B verify.py && python3 -O -B verify.py
      - name: False check still raises
        run: PYTHONPATH=. python3 -O -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Require a clean tree
        run: git diff --exit-code
